    <radialGradient id="glow" cx="82%" cy="0%" r="85%">
      <stop offset="0" stop-color="#0a41f5" stop-opacity="0.28" />
      <stop offset="1" stop-color="#0a41f5" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
